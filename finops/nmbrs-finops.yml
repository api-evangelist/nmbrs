meters:
- name: payslips
  description: Payslips actually issued to employees in a billing month - the primary billing unit.
  unit: payslips
  aggregation: sum
  dimensions:
  - company
  - package
  - country
- name: companies
  description: Companies (employers) managed, relevant to accountant / service-provider volume tiers.
  unit: companies
  aggregation: sum
  dimensions:
  - debtor
principles:
- name: Visibility
  description: Track paid payslips per company and per month; API-driven headcount changes directly move spend.
- name: Allocation
  description: Map companies and packages to internal cost centers or client accounts (for accountants/service providers).
- name: Optimization
  description: Because billing is per issued payslip, keeping employee records accurate (offboarding leavers) avoids paying for payslips you do not need; there is no charge for inactive employees left in the system.
- name: Accountability
  description: Assign owners per company/package; review monthly payslip counts against expected headcount.
