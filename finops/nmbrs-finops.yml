description: >-
  FinOps view of Nmbrs spend. Nmbrs is billed per payslip - you pay only for
  employees who actually receive a payslip in a given month, with no charge for
  inactive employees and no per-login or per-user fees. Business packages
  (Essential, Advanced, Advanced Pro) and a separate accountant / payroll
  service provider track set the per-payslip rate and included features, and
  differ by country (Netherlands in EUR, Sweden in SEK). API access - both the
  REST API and the legacy SOAP API - is included with a subscription and is not
  metered as a separate line item.
notes: >-
  Per-payslip unit rates are published on the Nmbrs country pricing pages and
  are not reconciled here. The dominant cost driver is the count of paid
  payslips per month, so headcount and payroll frequency are the levers.
