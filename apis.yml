aid: nmbrs
url: https://raw.githubusercontent.com/api-evangelist/nmbrs/refs/heads/main/apis.yml
name: Nmbrs
kind: company
description: >-
  Nmbrs (Visma Nmbrs) is cloud HR and payroll software for the Netherlands and
  Sweden, widely used by employers, accountants, and payroll service providers.
  Nmbrs exposes its HRIS and payroll data through a public API in two
  generations. The current, forward-looking interface is a REST API served from
  https://api.nmbrsapp.com, authenticated with OAuth 2.0 (Authorization Code
  flow via identityservice.nmbrs.com) plus a per-product subscription key, with
  granular scopes over companies, employees, employments, salaries, wage
  components, payruns, and absences. The older SOAP API (api.nmbrs.nl/soap/v3 -
  EmployeeService, CompanyService, DebtorService) remains available for existing
  integrations but is deprecated and scheduled to be retired on 1 March 2027,
  after which REST is the only supported API.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Human Resources
- HRIS
- Payroll
- Employee Management
- HR
- Absence Management
- Netherlands
- Sweden
- SOAP
- REST
